name: Build Chromium for Windows

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350   # 5小时50分，留10分钟余量

    steps:
      # 1. 检出你自己的仓库（触发 workflow 的那个）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 用 git clone 拉 depot_tools（正确来源，不走 actions/checkout）
      - name: Clone depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        shell: cmd

      # 3. 环境变量：PATH + 关闭 win toolchain 自动下载 + 关闭自动更新
      - name: Setup environment
        run: |
          echo "C:\depot_tools" >> %GITHUB_PATH%
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> %GITHUB_ENV%
          echo "DEPOT_TOOLS_UPDATE=0" >> %GITHUB_ENV%
        shell: cmd

      # 4. 拉 Chromium 源码（浅克隆，省时间省空间）
      - name: Fetch Chromium source
        run: |
          fetch --no-history chromium
        shell: cmd
        timeout-minutes: 150

      # 5. 生成构建配置（component build 省内存，symbol_level=0 省空间）
      - name: Generate build files
        run: |
          cd src
          gn gen out/Release --args="is_debug=false is_component_build=true symbol_level=0"
        shell: cmd

      # 6. 开始编译，-j 4 控制并行度
      - name: Build Chromium
        run: |
          cd src
          autoninja -C out/Release -j 4 chrome
        shell: cmd
        timeout-minutes: 180

      # 7. 上传编译产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-windows
          path: |
            src\out\Release\chrome.exe
            src\out\Release\*.dll
            src\out\Release\locales\
          retention-days: 7
