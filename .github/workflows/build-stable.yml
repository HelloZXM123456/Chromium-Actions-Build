name: Build Chromium for Windows
on:
  workflow_dispatch: # 允许手动触发

jobs:
  # 阶段 1: 准备源码
  fetch-source:
    runs-on: windows-latest
    steps:
      - name: Checkout depot_tools
        uses: actions/checkout@v4
        with:
          repository: 'chromium/depot_tools'
          path: 'depot_tools'
      - name: Add depot_tools to PATH
        run: echo "${{ github.workspace }}\\depot_tools" >> $env:GITHUB_PATH
      - name: Fetch Chromium source
        run: |
          # 注意：--no-history 可以节省大量时间和空间
          fetch --no-history chromium
        shell: cmd
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-src
          path: src/
          retention-days: 1 # 临时存储，节省空间

  # 阶段 2: 配置并开始编译
  build-stage-1:
    needs: fetch-source
    runs-on: windows-latest
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: chromium-src
          path: src/
      - name: Add depot_tools to PATH
        run: echo "${{ github.workspace }}\\depot_tools" >> $env:GITHUB_PATH
      - name: Generate build files
        run: |
          cd src
          gn gen out/Release --args="is_debug=false is_component_build=false symbol_level=0"
        shell: cmd
      - name: Build (part 1)
        run: |
          cd src
          # 使用 -j 控制并行度，避免内存不足
          autoninja -C out/Release -j 4 chrome
        shell: cmd
        # 注意：这里如果超时，需要根据日志判断编译进度，在下一个 job 中继续
      - name: Upload build state
        uses: actions/upload-artifact@v4
        with:
          name: chromium-build-state
          path: src/
          retention-days: 1
